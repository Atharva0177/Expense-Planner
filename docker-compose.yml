services:
  expense-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_planner_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - path: .env
        required: false

  # n8n powers the Telegram bot (see n8n/README.md).
  # Start with: docker compose --profile n8n up -d
  n8n:
    image: n8nio/n8n:latest
    container_name: expense_planner_n8n
    restart: unless-stopped
    profiles:
      - n8n
    ports:
      - "5678:5678"
    environment:
      # IMPORTANT: set N8N_ENCRYPTION_KEY in .env (generate with: openssl rand -base64 32).
      # If left empty, n8n regenerates an ephemeral key on every restart and saved credentials break.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      # Public HTTPS URL that reaches this n8n instance (required for the
      # Telegram webhook). When using the cloudflared service below, this is
      # the public hostname you configured for the tunnel, e.g.
      # https://n8n.your-domain.com
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      # Bot token is read by the workflow's /setup-menu command ($env)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n

  # ngrok: exposes n8n to the internet over HTTPS using a free static domain
  # (https://dashboard.ngrok.com/domains). Telegram's webhook POSTs pass through
  # without the browser interstitial; use localhost:5678 for the n8n editor UI.
  ngrok:
    image: ngrok/ngrok:latest
    container_name: expense_planner_ngrok
    restart: unless-stopped
    profiles:
      - n8n
    # IMPORTANT: set NGROK_AUTHTOKEN and NGROK_DOMAIN in .env (free account at
    # https://dashboard.ngrok.com; authtoken + static domain under your dashboard)
    command: http --url=${NGROK_DOMAIN:-} --log stdout n8n:5678
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}

  # Alternative (requires owning a registered domain on Cloudflare):
  # Cloudflare Tunnel. Point its public hostname at http://n8n:5678 and set
  # N8N_WEBHOOK_URL + CLOUDFLARED_TUNNEL_TOKEN, then swap this in for ngrok.
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: expense_planner_tunnel
  #   restart: unless-stopped
  #   profiles:
  #     - n8n
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:-}

  # ---- Free 24/7 hosting: Oracle Cloud Always Free VM ----
  # Full guide: n8n/ORACLE-HOSTING.md. Runs the SAME n8n workflow without
  # ngrok: Caddy fronts n8n with automatic Let's Encrypt HTTPS on a free
  # DuckDNS hostname. Start on the VM with:
  #   docker compose --profile oracle up -d n8n-server caddy
  # IMPORTANT: never run this at the same time as the local `n8n` profile -
  # both register the same Telegram bot webhook and would fight over messages.
  n8n-server:
    image: n8nio/n8n:latest
    container_name: expense_planner_n8n_server
    restart: unless-stopped
    profiles:
      - oracle
    ports:
      # Editor fallback via SSH tunnel only (ssh -L 5678:localhost:5678 ...);
      # the public entry point is Caddy on 443.
      - "127.0.0.1:5678:5678"
    environment:
      # Use the SAME N8N_ENCRYPTION_KEY as your local instance if you migrate
      # the data volume - otherwise saved credentials cannot be decrypted.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-}
      # Your DuckDNS hostname, e.g. expenseplanner.duckdns.org. Leaving it as
      # "localhost" breaks webhook registration on the VM.
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
    volumes:
      - n8n_server_data:/home/node/.n8n

  caddy:
    image: caddy:2
    container_name: expense_planner_caddy
    restart: unless-stopped
    profiles:
      - oracle
    depends_on:
      - n8n-server
    ports:
      - "80:80" # Let's Encrypt HTTP-01 challenge + redirect to https
      - "443:443" # n8n editor + webhooks (HTTPS)
    environment:
      # Caddyfile serves this host and auto-obtains its Let's Encrypt cert.
      - N8N_HOST=${N8N_HOST:-localhost}
    volumes:
      - ./n8n/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  n8n_data:
  n8n_server_data:
  caddy_data:
  caddy_config:
