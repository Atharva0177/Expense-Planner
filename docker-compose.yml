version: "3.8"

services:
  expense-planner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_planner_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - path: .env
        required: false
