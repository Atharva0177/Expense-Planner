<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8899aa"/>
    </marker>
    <style>
      .b { fill:#131b26; stroke:#2b3a4d; stroke-width:1.5; rx:10; }
      .ok { stroke:#3f7d5a; }
      .t { fill:#e8eef5; font-size:15px; font-weight:600; }
      .s { fill:#9fb0c3; font-size:12px; }
      .e { stroke:#8899aa; stroke-width:1.6; fill:none; marker-end:url(#a2); }
      .el { fill:#8fa5bd; font-size:11.5px; }
      .num { fill:#7fb8e0; font-size:13px; font-weight:700; }
    </style>
  </defs>
  <rect width="1200" height="560" fill="#0b1119"/>

  <rect x="40" y="60" width="200" height="90" class="b" rx="10"/>
  <text x="140" y="95" text-anchor="middle" class="t">User picks photo</text>
  <text x="140" y="118" text-anchor="middle" class="s">gallery / camera</text>
  <text x="140" y="138" text-anchor="middle" class="s">HEIC, PNG, JPG</text>

  <rect x="300" y="60" width="220" height="90" class="b" rx="10"/>
  <text x="410" y="92" text-anchor="middle" class="t">imageUtils.ts</text>
  <text x="410" y="114" text-anchor="middle" class="s">HEIC → JPEG decode</text>
  <text x="410" y="134" text-anchor="middle" class="s">resize to 1600px, base64</text>

  <rect x="580" y="60" width="260" height="90" class="b" rx="10"/>
  <text x="710" y="92" text-anchor="middle" class="t">POST /api/scan-receipt</text>
  <text x="710" y="114" text-anchor="middle" class="s">same code path on all 3 hosts</text>
  <text x="710" y="134" text-anchor="middle" class="s">Express · Vercel · Cloudflare</text>

  <rect x="900" y="40" width="260" height="130" class="b" rx="10"/>
  <text x="1030" y="70" text-anchor="middle" class="t">Gemini model chain</text>
  <text x="1030" y="94" text-anchor="middle" class="s">1. gemini-2.5-flash</text>
  <text x="1030" y="114" text-anchor="middle" class="s">2. gemini-flash-latest</text>
  <text x="1030" y="134" text-anchor="middle" class="s">3. gemini-3.7-flash</text>
  <text x="1030" y="154" text-anchor="middle" class="s">4. gemini-2.5-flash-lite</text>

  <rect x="580" y="230" width="260" height="80" class="b ok" rx="10"/>
  <text x="710" y="260" text-anchor="middle" class="t">Structured JSON</text>
  <text x="710" y="282" text-anchor="middle" class="s">{ amount, date,</text>
  <text x="710" y="300" text-anchor="middle" class="s">  merchant, category }</text>

  <rect x="300" y="230" width="220" height="80" class="b" rx="10"/>
  <text x="410" y="260" text-anchor="middle" class="t">Pre-filled form</text>
  <text x="410" y="282" text-anchor="middle" class="s">user reviews &amp; edits</text>
  <text x="410" y="302" text-anchor="middle" class="s">then saves to Firestore</text>

  <!-- 3-tier client fallback -->
  <rect x="40" y="400" width="1120" height="120" fill="none" stroke="#22303f" stroke-width="1.5" stroke-dasharray="6 5" rx="14"/>
  <text x="62" y="430" fill="#5f7489" font-size="13" font-weight="600" letter-spacing="1">CLIENT 3-TIER FALLBACK — receiptScanner.ts</text>

  <rect x="80" y="450" width="300" height="52" class="b" rx="10"/>
  <text x="230" y="481" text-anchor="middle" class="s"><tspan class="num">Tier 1</tspan>  same-origin /api (prod)</text>
  <rect x="440" y="450" width="300" height="52" class="b" rx="10"/>
  <text x="590" y="481" text-anchor="middle" class="s"><tspan class="num">Tier 2</tspan>  VITE_API_URL override</text>
  <rect x="800" y="450" width="300" height="52" class="b" rx="10"/>
  <text x="950" y="481" text-anchor="middle" class="s"><tspan class="num">Tier 3</tspan>  direct Gemini call (dev key)</text>

  <path class="e" d="M240 105 L300 105"/>
  <path class="e" d="M520 105 L580 105"/>
  <path class="e" d="M840 105 L900 105"/>
  <text x="845" y="92" class="el">base64</text>
  <path class="e" d="M1030 170 C 1030 220 920 270 840 270"/>
  <text x="950" y="215" class="el">first success wins</text>
  <path class="e" d="M580 270 L520 270"/>

  <path class="e" d="M710 150 L710 230"/>
</svg>
