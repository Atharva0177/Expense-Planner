<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8899aa"/>
    </marker>
    <style>
      .box { fill:#131b26; stroke:#2b3a4d; stroke-width:1.5; rx:10; }
      .title { fill:#e8eef5; font-size:16px; font-weight:600; }
      .sub { fill:#9fb0c3; font-size:12px; }
      .lbl { fill:#c9d6e2; font-size:12.5px; }
      .edge { stroke:#8899aa; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .edgeLbl { fill:#8fa5bd; font-size:11.5px; }
      .zone { fill:none; stroke:#22303f; stroke-width:1.5; stroke-dasharray:6 5; rx:14; }
      .zoneLbl { fill:#5f7489; font-size:13px; font-weight:600; letter-spacing:1px; }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#0b1119"/>

  <!-- Client zone -->
  <rect x="30" y="60" width="380" height="600" class="zone"/>
  <text x="55" y="92" class="zoneLbl">BROWSER (React 19 SPA)</text>

  <rect x="60" y="115" width="320" height="70" class="box" rx="10"/>
  <text x="220" y="145" text-anchor="middle" class="title">React 19 + Vite 6 + TS</text>
  <text x="220" y="167" text-anchor="middle" class="sub">Tailwind v4 · react-router · recharts</text>

  <rect x="60" y="210" width="320" height="90" class="box" rx="10"/>
  <text x="220" y="238" text-anchor="middle" class="title">src/lib/db.ts</text>
  <text x="220" y="260" text-anchor="middle" class="sub">dataCache 25s TTL · in-flight dedup</text>
  <text x="220" y="280" text-anchor="middle" class="sub">getHhId() household cache 30s</text>

  <rect x="60" y="325" width="320" height="80" class="box" rx="10"/>
  <text x="220" y="353" text-anchor="middle" class="title">Domain Engines (pure TS)</text>
  <text x="220" y="375" text-anchor="middle" class="sub">taxUtils · loanUtils · exportUtils</text>
  <text x="220" y="394" text-anchor="middle" class="sub">receiptScanner · imageUtils</text>

  <rect x="60" y="430" width="320" height="70" class="box" rx="10"/>
  <text x="220" y="458" text-anchor="middle" class="title">Firebase Web SDK</text>
  <text x="220" y="480" text-anchor="middle" class="sub">Auth + Firestore (persistent multi-tab)</text>

  <rect x="60" y="525" width="320" height="60" class="box" rx="10"/>
  <text x="220" y="550" text-anchor="middle" class="title">fetch('/api/scan-receipt')</text>
  <text x="220" y="571" text-anchor="middle" class="sub">base64 image → structured JSON</text>

  <!-- Firebase zone -->
  <rect x="470" y="60" width="330" height="290" class="zone"/>
  <text x="495" y="92" class="zoneLbl">GOOGLE FIREBASE</text>

  <rect x="500" y="115" width="270" height="70" class="box" rx="10"/>
  <text x="635" y="143" text-anchor="middle" class="title">Firebase Auth</text>
  <text x="635" y="165" text-anchor="middle" class="sub">email / password</text>

  <rect x="500" y="205" width="270" height="110" class="box" rx="10"/>
  <text x="635" y="233" text-anchor="middle" class="title">Cloud Firestore</text>
  <text x="635" y="255" text-anchor="middle" class="sub">named DB · 15 collections</text>
  <text x="635" y="276" text-anchor="middle" class="sub">every doc: user_id + household_id</text>
  <text x="635" y="297" text-anchor="middle" class="sub">security rules: auth-only (audit finding)</text>

  <!-- Server zone -->
  <rect x="850" y="60" width="320" height="360" class="zone"/>
  <text x="875" y="92" class="zoneLbl">API LAYER (only 2 endpoints)</text>

  <rect x="880" y="115" width="260" height="80" class="box" rx="10"/>
  <text x="1010" y="143" text-anchor="middle" class="title">Express — server.ts</text>
  <text x="1010" y="165" text-anchor="middle" class="sub">dev/self-host · 4-model retry chain</text>
  <text x="1010" y="184" text-anchor="middle" class="sub">/api/health · /api/scan-receipt</text>

  <rect x="880" y="215" width="260" height="70" class="box" rx="10"/>
  <text x="1010" y="243" text-anchor="middle" class="title">Vercel — api/scan-receipt.ts</text>
  <text x="1010" y="265" text-anchor="middle" class="sub">serverless fn · single model</text>

  <rect x="880" y="305" width="260" height="80" class="box" rx="10"/>
  <text x="1010" y="333" text-anchor="middle" class="title">Cloudflare — functions/api/</text>
  <text x="1010" y="355" text-anchor="middle" class="sub">Pages Function · raw REST</text>
  <text x="1010" y="374" text-anchor="middle" class="sub">explicit CORS headers</text>

  <!-- Gemini -->
  <rect x="880" y="490" width="260" height="90" class="box" rx="10"/>
  <text x="1010" y="520" text-anchor="middle" class="title">Google Gemini API</text>
  <text x="1010" y="542" text-anchor="middle" class="sub">2.5-flash → flash-latest →</text>
  <text x="1010" y="561" text-anchor="middle" class="sub">3.7-flash → 2.5-flash-lite</text>

  <!-- Edges -->
  <path class="edge" d="M220 300 L220 325"/>
  <path class="edge" d="M220 405 L220 430"/>
  <path class="edge" d="M380 465 C 440 465 440 150 500 150"/>
  <text x="425" y="140" class="edgeLbl">sign in</text>
  <path class="edge" d="M380 480 C 450 480 440 260 500 260"/>
  <text x="408" y="300" class="edgeLbl">direct CRUD (no server)</text>

  <path class="edge" d="M380 555 C 620 555 640 155 880 155"/>
  <text x="600" y="545" class="edgeLbl">POST image (Express / Vercel / Cloudflare)</text>

  <path class="edge" d="M1010 195 L1010 215"/>
  <path class="edge" d="M1010 285 L1010 305"/>
  <path class="edge" d="M1010 385 C 1010 430 1010 450 1010 490"/>
  <text x="1020" y="440" class="edgeLbl">API key (env)</text>

  <text x="600" y="690" text-anchor="middle" class="sub">Serverless-first: all data flows browser ⇄ Firestore. Servers exist only to proxy Gemini receipt OCR.</text>
</svg>
