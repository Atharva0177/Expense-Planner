<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="860" viewBox="0 0 1300 860" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .ent { fill:#131b26; stroke:#2b3a4d; stroke-width:1.5; }
      .head { fill:#1c2a3a; }
      .t { fill:#e8eef5; font-size:14px; font-weight:600; }
      .f { fill:#a7b8ca; font-size:11.5px; }
      .pk { fill:#7fd4a8; }
      .rel { stroke:#4a5f78; stroke-width:1.4; fill:none; }
      .rl { fill:#8fa5bd; font-size:11px; }
      .grp { fill:none; stroke:#22303f; stroke-width:1.5; stroke-dasharray:6 5; rx:14; }
      .gl { fill:#5f7489; font-size:13px; font-weight:600; letter-spacing:1px; }
    </style>
  </defs>
  <rect width="1300" height="860" fill="#0b1119"/>

  <!-- Identity group -->
  <rect x="30" y="30" width="440" height="330" class="grp"/>
  <text x="52" y="60" class="gl">IDENTITY &amp; HOUSEHOLD</text>

  <g>
    <rect x="60" y="80" width="180" height="118" class="ent" rx="8"/>
    <rect x="60" y="80" width="180" height="30" class="head" rx="8"/>
    <text x="150" y="100" text-anchor="middle" class="t">users</text>
    <text x="72" y="126" class="f"><tspan class="pk">uid (doc id)</tspan></text>
    <text x="72" y="146" class="f">email, display_name</text>
    <text x="72" y="166" class="f">role: primary|spouse|dep</text>
    <text x="72" y="186" class="f">created_at</text>
  </g>

  <g>
    <rect x="290" y="80" width="160" height="98" class="ent" rx="8"/>
    <rect x="290" y="80" width="160" height="30" class="head" rx="8"/>
    <text x="370" y="100" text-anchor="middle" class="t">households</text>
    <text x="302" y="126" class="f"><tspan class="pk">id</tspan> · name</text>
    <text x="302" y="146" class="f">created_by (uid)</text>
    <text x="302" y="166" class="f">created_at</text>
  </g>

  <g>
    <rect x="60" y="225" width="180" height="108" class="ent" rx="8"/>
    <rect x="60" y="225" width="180" height="30" class="head" rx="8"/>
    <text x="150" y="245" text-anchor="middle" class="t">household_members</text>
    <text x="72" y="271" class="f"><tspan class="pk">id</tspan> · household_id</text>
    <text x="72" y="291" class="f">user_id</text>
    <text x="72" y="311" class="f">role, joined_at</text>
  </g>

  <g>
    <rect x="290" y="225" width="160" height="88" class="ent" rx="8"/>
    <rect x="290" y="225" width="160" height="30" class="head" rx="8"/>
    <text x="370" y="245" text-anchor="middle" class="t">invites</text>
    <text x="302" y="271" class="f">code (6-char)</text>
    <text x="302" y="291" class="f">household_id · 7d expiry</text>
  </g>

  <path class="rel" d="M240 129 L290 129"/><text x="252" y="120" class="rl">1:N</text>
  <path class="rel" d="M150 198 L150 225"/><text x="160" y="218" class="rl">1:N</text>
  <path class="rel" d="M370 178 L370 225"/><text x="380" y="205" class="rl">1:N</text>

  <!-- Finance group -->
  <rect x="30" y="400" width="840" height="420" class="grp"/>
  <text x="52" y="430" class="gl">FINANCE DATA — every document carries user_id + household_id</text>

  <g>
    <rect x="60" y="450" width="200" height="118" class="ent" rx="8"/>
    <rect x="60" y="450" width="200" height="30" class="head" rx="8"/>
    <text x="160" y="470" text-anchor="middle" class="t">transactions</text>
    <text x="72" y="496" class="f">amount, date, type</text>
    <text x="72" y="516" class="f">category_id (stores name)</text>
    <text x="72" y="536" class="f">notes, receipt_url?</text>
    <text x="72" y="556" class="f">recurring_rule_id?</text>
  </g>

  <g>
    <rect x="300" y="450" width="190" height="98" class="ent" rx="8"/>
    <rect x="300" y="450" width="190" height="30" class="head" rx="8"/>
    <text x="395" y="470" text-anchor="middle" class="t">income_entries</text>
    <text x="312" y="496" class="f">source, amount, date</text>
    <text x="312" y="516" class="f">is_taxable, notes</text>
    <text x="312" y="536" class="f">member filter for taxes</text>
  </g>

  <g>
    <rect x="530" y="450" width="170" height="78" class="ent" rx="8"/>
    <rect x="530" y="450" width="170" height="30" class="head" rx="8"/>
    <text x="615" y="470" text-anchor="middle" class="t">categories</text>
    <text x="542" y="496" class="f">name, icon, color</text>
    <text x="542" y="516" class="f">type: expense|income</text>
  </g>

  <g>
    <rect x="730" y="450" width="160" height="98" class="ent" rx="8"/>
    <rect x="730" y="450" width="160" height="30" class="head" rx="8"/>
    <text x="810" y="470" text-anchor="middle" class="t">budgets</text>
    <text x="742" y="496" class="f">category, month</text>
    <text x="742" y="516" class="f">limit_amount</text>
    <text x="742" y="536" class="f">alert threshold</text>
  </g>

  <g>
    <rect x="60" y="610" width="200" height="118" class="ent" rx="8"/>
    <rect x="60" y="610" width="200" height="30" class="head" rx="8"/>
    <text x="160" y="630" text-anchor="middle" class="t">recurring_rules</text>
    <text x="72" y="656" class="f">amount, category</text>
    <text x="72" y="676" class="f">frequency, next_run</text>
    <text x="72" y="696" class="f">active flag</text>
    <text x="72" y="716" class="f">(manual trigger only)</text>
  </g>

  <g>
    <rect x="300" y="610" width="190" height="98" class="ent" rx="8"/>
    <rect x="300" y="610" width="190" height="30" class="head" rx="8"/>
    <text x="395" y="630" text-anchor="middle" class="t">loans</text>
    <text x="312" y="656" class="f">principal, rate, tenure</text>
    <text x="312" y="676" class="f">emi (computed)</text>
    <text x="312" y="696" class="f">start_date, lender</text>
  </g>

  <g>
    <rect x="530" y="610" width="170" height="88" class="ent" rx="8"/>
    <rect x="530" y="610" width="170" height="30" class="head" rx="8"/>
    <text x="615" y="630" text-anchor="middle" class="t">loan_schedules</text>
    <text x="542" y="656" class="f">loan_id, month_no</text>
    <text x="542" y="676" class="f">interest / principal split</text>
  </g>

  <g>
    <rect x="730" y="610" width="160" height="98" class="ent" rx="8"/>
    <rect x="730" y="610" width="160" height="30" class="head" rx="8"/>
    <text x="810" y="630" text-anchor="middle" class="t">goals</text>
    <text x="742" y="656" class="f">name, target_amount</text>
    <text x="742" y="676" class="f">saved_amount</text>
    <text x="742" y="696" class="f">deadline</text>
  </g>

  <g>
    <rect x="60" y="755" width="200" height="78" class="ent" rx="8"/>
    <rect x="60" y="755" width="200" height="30" class="head" rx="8"/>
    <text x="160" y="775" text-anchor="middle" class="t">tax_calculations</text>
    <text x="72" y="801" class="f">fy, regime results</text>
    <text x="72" y="821" class="f">deductions snapshot</text>
  </g>

  <path class="rel" d="M260 509 L300 509"/>
  <path class="rel" d="M490 489 L530 489"/>
  <path class="rel" d="M700 489 L730 489"/>
  <path class="rel" d="M395 548 L395 610"/>
  <path class="rel" d="M490 654 L530 654"/>
  <path class="rel" d="M160 568 L160 610"/>
  <path class="rel" d="M260 669 L300 655"/>

  <!-- Investments group -->
  <rect x="920" y="30" width="350" height="330" class="grp"/>
  <text x="942" y="60" class="gl">INVESTMENTS</text>

  <g>
    <rect x="950" y="80" width="290" height="78" class="ent" rx="8"/>
    <rect x="950" y="80" width="290" height="30" class="head" rx="8"/>
    <text x="1095" y="100" text-anchor="middle" class="t">investment_accounts</text>
    <text x="962" y="126" class="f">name, broker, type</text>
    <text x="962" y="146" class="f">user_id + household_id</text>
  </g>

  <g>
    <rect x="950" y="185" width="290" height="78" class="ent" rx="8"/>
    <rect x="950" y="185" width="290" height="30" class="head" rx="8"/>
    <text x="1095" y="205" text-anchor="middle" class="t">investment_holdings</text>
    <text x="962" y="231" class="f">account_id, symbol, qty</text>
    <text x="962" y="251" class="f">avg_cost → P&amp;L + capital gains</text>
  </g>

  <g>
    <rect x="950" y="290" width="290" height="58" class="ent" rx="8"/>
    <rect x="950" y="290" width="290" height="30" class="head" rx="8"/>
    <text x="1095" y="310" text-anchor="middle" class="t">investment_valuations</text>
    <text x="962" y="336" class="f">account_id, date, value</text>
  </g>

  <path class="rel" d="M1095 158 L1095 185"/>
  <path class="rel" d="M1095 263 L1095 290"/>

  <text x="650" y="850" text-anchor="middle" class="f" fill="#5f7489">15 collections · household-scoped · queried household-first via cached getHhId()</text>
</svg>
